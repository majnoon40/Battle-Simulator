name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (headless)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Release, BUILD_GAME=OFF)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Determinism check (same seed twice)
        run: |
          ./build/battle_cli --scenario default --seed 42 --export-json a.json
          ./build/battle_cli --scenario default --seed 42 --export-json b.json
          diff a.json b.json
          echo "byte-identical exports for seed 42"

      - name: Determinism check (grid == brute neighbor modes)
        run: |
          ./build/battle_cli --scenario default --seed 42 --neighbor-mode grid --export-json g.json
          ./build/battle_cli --scenario default --seed 42 --neighbor-mode brute --export-json c.json
          diff g.json c.json
          echo "grid and brute neighbor modes agree"

  game-build:
    name: Game window build (compile only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install raylib dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
                                  libxinerama-dev libxi-dev libgl-dev \
                                  libasound2-dev

      - name: Configure (BUILD_GAME=ON)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=ON

      - name: Build battle_game (never run — no display on runners)
        run: cmake --build build --target battle_game -j"$(nproc)"

  mapgen:
    name: Map generator tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pillow

      - name: Run mapgen tests (offline)
        working-directory: tools/mapgen
        run: python3 -m unittest discover -v

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Debug, sanitizers)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # m13 item 4: ThreadSanitizer over the worker pool, the cross-thread
  # determinism tests, and the unit/squad/morale suites that exercise the
  # parallel decision phase. (The full suite under TSan would take hours;
  # the thread-relevant selection covers every code path that runs on
  # the pool — the pool tests themselves, the multithreaded battles, and
  # the sim mechanics whose state feeds the parallel pass.)
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Debug, TSan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Thread-pool and multithreading tests
        run: >
          ./build/battle_tests --gtest_filter='ThreadPoolTest.*:ThreadsDeterminismTest.*:PhaseProfilingTest.*'
          --gtest_break_on_failure
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

      - name: Simulation and squad mechanics under TSan
        run: >
          ./build/battle_tests
          --gtest_filter='DeterminismTest.*:TerminationTest.*:TerminationV2Test.*:MoraleStateTest.*:MoraleDeltaTest.*:MoraleModifierTest.*:MoraleOnTest.*:MoraleOffTest.*:SquadAssignmentTest.*:SquadSeparationTest.*:SquadConfigValidationTest.*:ConfigValidationTest.*'
          --gtest_break_on_failure
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

  # m13 item 6: 60 seconds of libFuzzer per harness on every push. The
  # nightly workflow runs the long version; the corpus lives in
  # fuzz/corpus and grows from findings.
  fuzzing:
    name: Fuzzing (libFuzzer, 60s per target)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure (clang, BUILD_FUZZING=ON)
        run: >
          CC=clang CXX=clang++ cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=Release -DBUILD_FUZZING=ON

      - name: Build the fuzz targets
        run: cmake --build build-fuzz -j"$(nproc)"

      - name: Fuzz every harness (60s each, seed corpus)
        run: |
          for target in unit_types scenario personalities morale tactics formations commanders combat terrain_grid settings replay order_script simulation; do
            echo "=== fuzz_${target} ==="
            ./build-fuzz/fuzz_${target} -max_total_time=60 -rss_limit_mb=2560 -timeout=25 -print_final_stats=1 fuzz/corpus/${target}
          done

  # m13 item 7: cross-platform builds. macOS runs the full suite (same
  # IEEE doubles + the forced -ffp-contract=off keep the determinism
  # pins platform-independent); Windows is compile + smoke only — MSVC
  # is not built with the pinned FP flags (they are gcc/clang-only),
  # so cross-platform hash equality is not claimed there.
  macos-build-test:
    name: macOS build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-build:
    name: Windows build (compile + smoke)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build battle_cli
        run: cmake --build build --target battle_cli --config Release

      - name: Smoke run
        shell: bash
        run: ./build/Release/battle_cli --scenario data/scenarios/default.json --seed 42 --ticks 10

      # M14 item 4: Windows byte-identity evidence. The same seeds must
      # produce the Linux/macOS export bytes (the sim math is IEEE-exact
      # ops plus atan2; see docs/milestone-14.md item 4). A failure here
      # is a real cross-platform finding, not a flaky test.
      - name: Export byte-identity pins (default + three-way)
        shell: bash
        run: |
          ./build/Release/battle_cli --scenario data/scenarios/default.json --seed 42 --ticks 300 --export-json pin-default.json
          ./build/Release/battle_cli --scenario data/scenarios/three-way.json --seed 42 --ticks 300 --export-json pin-three-way.json
          echo "908322e6c9fc9a9c5923b0b748f8655f  pin-default.json" | md5sum -c -
          echo "95579bb578efe756ec7c215548fe2092  pin-three-way.json" | md5sum -c -
