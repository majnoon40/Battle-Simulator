name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (headless)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Release, BUILD_GAME=OFF)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Determinism check (same seed twice)
        run: |
          ./build/battle_cli --scenario default --seed 42 --export-json a.json
          ./build/battle_cli --scenario default --seed 42 --export-json b.json
          diff a.json b.json
          echo "byte-identical exports for seed 42"

      - name: Determinism check (grid == brute neighbor modes)
        run: |
          ./build/battle_cli --scenario default --seed 42 --neighbor-mode grid --export-json g.json
          ./build/battle_cli --scenario default --seed 42 --neighbor-mode brute --export-json c.json
          diff g.json c.json
          echo "grid and brute neighbor modes agree"

  invariants:
    name: Invariant checker (M15 S1)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Release, BUILD_GAME=OFF)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=OFF

      - name: Build battle_cli
        run: cmake --build build --target battle_cli -j"$(nproc)"

      # M15 S1: every shipped scenario with the invariant checker on,
      # both orientations, thread counts 1 and 4, and scripted generals
      # on and off (~30 runs; a violation exits 3 and fails the job).
      - name: Run all shipped scenarios with the checker (threads 1)
        run: |
          set -e
          for s in data/scenarios/*.json; do
            name=$(basename "$s")
            echo "== checker: $name (threads 1)"
            ./build/battle_cli --scenario "$s" --seed 42 --ticks 300 \
              --check-invariants=10 > /dev/null
          done

      - name: Swapped orientations with the checker
        run: |
          set -e
          for s in default mixed squads demo-river balanced-demo earth-lebanon viewer-demo; do
            echo "== checker: $s --swap-sides"
            ./build/battle_cli --scenario "$s" --seed 42 --ticks 300 \
              --swap-sides --check-invariants=10 > /dev/null
          done

      - name: Thread-count independence with the checker (threads 4)
        run: |
          set -e
          for s in default squads perf-5000 three-way; do
            echo "== checker: $s (threads 4)"
            ./build/battle_cli --scenario "$s" --seed 42 --ticks 300 \
              --threads 4 --check-invariants=10 > /dev/null
          done

      - name: Scripted generals with the checker
        run: |
          set -e
          cat > aggressive.lua <<'EOF'
          function decide(g)
            if g.enemies.count == 0 then return nil end
            return {{squad = "all", order = "attackmove",
                     x = g.enemies.centroid_x, y = g.enemies.centroid_y}}
          end
          EOF
          echo "== checker: default with generals"
          ./build/battle_cli --scenario default --seed 42 --ticks 300 \
            --general aggressive.lua --check-invariants=10 > /dev/null
          echo "== checker: three-way with generals"
          ./build/battle_cli --scenario three-way --seed 42 --ticks 300 \
            --general aggressive.lua --check-invariants=10 > /dev/null

      - name: A corrupt state actually fails (negative control)
        run: |
          # The checker must not be a no-op: --check-invariants on a
          # healthy battle exits 0; the exit code 3 path is exercised by
          # the unit tests (InvariantCorruption). Here we assert the
          # happy path exits 0 so a silent skip cannot pass the job.
          ./build/battle_cli --scenario default --seed 42 --ticks 100 \
            --check-invariants > /dev/null
          echo "checker smoke passed"

  differential:
    name: Differential (M15 S2)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Release, BUILD_GAME=OFF)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=OFF

      - name: Build battle_cli
        run: cmake --build build --target battle_cli -j"$(nproc)"

      # M15 S2: replay record/verify on EVERY shipped scenario (the
      # DifferentialTest suite keeps representatives in the regular
      # test run). Tick budgets: 300, 150 for the 5k perf scenarios,
      # 100 for the 20k ones.
      - name: Replay record/verify on every shipped scenario
        run: |
          set -e
          ticks_for() {
            case "$1" in
              perf-20000*) echo 100;;
              perf-5000*|demo-river-perf) echo 150;;
              *) echo 300;;
            esac
          }
          for s in data/scenarios/*.json; do
            name=$(basename "$s" .json)
            t=$(ticks_for "$name")
            ./build/battle_cli --scenario "$s" --seed 42 --ticks "$t" \
              --record /tmp/s2.replay > /dev/null
            ./build/battle_cli --replay /tmp/s2.replay --verify \
              | grep -q "replay verified"
            echo "$name: verified"
          done
          # Both orientations for an open field and an earth map.
          for s in default earth-lebanon; do
            ./build/battle_cli --scenario "data/scenarios/$s.json" \
              --seed 42 --ticks 300 --swap-sides \
              --record /tmp/s2.replay > /dev/null
            ./build/battle_cli --replay /tmp/s2.replay --verify \
              | grep -q "replay verified"
            echo "$s --swap-sides: verified"
          done

      # M15 S2: aggregate fairness on the symmetric default.json. The
      # per-seed winner-flip property does NOT hold (spawn draws are
      # allocated by faction index and translated into the flipped
      # band, not mirrored — docs/milestone-15.md S2), but the symmetric
      # map must stay fair in aggregate. The counts are exact pins of
      # deterministic battles: a battle-behavior change (always behind
      # a flag) shifts them and forces a conscious re-measure.
      # Measured: Red 49 / Blue 50 / draw 1 of 100.
      - name: Side-swap aggregate fairness (50 seeds, both orientations)
        run: |
          set -e
          red=0; blue=0; draw=0
          for seed in $(seq 1 50); do
            for extra in "" "--swap-sides"; do
              ./build/battle_cli --scenario data/scenarios/default.json \
                --seed "$seed" --ticks 2000 $extra \
                --report /tmp/s2_fair.md > /dev/null
              w=$(grep -o '"winner": "[^"]*"' /tmp/s2_fair.json)
              case "$w" in
                *'"Red"'*) red=$((red+1));;
                *'"Blue"'*) blue=$((blue+1));;
                *) draw=$((draw+1));;
              esac
            done
          done
          echo "fairness: red=$red blue=$blue draw=$draw (pinned 49/50/1)"
          [ "$red" -eq 49 ] && [ "$blue" -eq 50 ] && [ "$draw" -eq 1 ]

      # M15 S2: grid == brute on every scenario small enough for the
      # O(n^2) scan (the gtest covers five, demo-river included, at
      # battle length).
      - name: Grid == brute neighbor modes
        run: |
          set -e
          for s in default mixed m10-line squads balanced-demo three-way viewer-demo; do
            ./build/battle_cli --scenario "data/scenarios/$s.json" \
              --seed 42 --ticks 300 --neighbor-mode grid \
              --export-json /tmp/s2_g.json > /dev/null
            ./build/battle_cli --scenario "data/scenarios/$s.json" \
              --seed 42 --ticks 300 --neighbor-mode brute \
              --export-json /tmp/s2_b.json > /dev/null
            cmp /tmp/s2_g.json /tmp/s2_b.json
            echo "$s: grid == brute"
          done

  game-build:
    name: Game window build (compile only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install raylib dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
                                  libxinerama-dev libxi-dev libgl-dev \
                                  libasound2-dev

      - name: Configure (BUILD_GAME=ON)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=ON

      - name: Build battle_game (never run — no display on runners)
        run: cmake --build build --target battle_game -j"$(nproc)"

  mapgen:
    name: Map generator tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pillow

      - name: Run mapgen tests (offline)
        working-directory: tools/mapgen
        run: python3 -m unittest discover -v

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Debug, sanitizers)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # m13 item 4: ThreadSanitizer over the worker pool, the cross-thread
  # determinism tests, and the unit/squad/morale suites that exercise the
  # parallel decision phase. (The full suite under TSan would take hours;
  # the thread-relevant selection covers every code path that runs on
  # the pool — the pool tests themselves, the multithreaded battles, and
  # the sim mechanics whose state feeds the parallel pass.)
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Debug, TSan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Thread-pool and multithreading tests
        run: >
          ./build/battle_tests --gtest_filter='ThreadPoolTest.*:ThreadsDeterminismTest.*:PhaseProfilingTest.*'
          --gtest_break_on_failure
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

      - name: Simulation and squad mechanics under TSan
        run: >
          ./build/battle_tests
          --gtest_filter='DeterminismTest.*:TerminationTest.*:TerminationV2Test.*:MoraleStateTest.*:MoraleDeltaTest.*:MoraleModifierTest.*:MoraleOnTest.*:MoraleOffTest.*:SquadAssignmentTest.*:SquadSeparationTest.*:SquadConfigValidationTest.*:ConfigValidationTest.*'
          --gtest_break_on_failure
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

  # m13 item 6: 60 seconds of libFuzzer per harness on every push. The
  # nightly workflow runs the long version; the corpus lives in
  # fuzz/corpus and grows from findings.
  fuzzing:
    name: Fuzzing (libFuzzer, 60s per target)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure (clang, BUILD_FUZZING=ON)
        run: >
          CC=clang CXX=clang++ cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=Release -DBUILD_FUZZING=ON

      - name: Build the fuzz targets
        run: cmake --build build-fuzz -j"$(nproc)"

      - name: Fuzz every harness (60s each, seed corpus)
        run: |
          for target in unit_types scenario personalities morale tactics formations commanders combat terrain_grid settings replay order_script simulation; do
            echo "=== fuzz_${target} ==="
            ./build-fuzz/fuzz_${target} -max_total_time=60 -rss_limit_mb=2560 -timeout=25 -print_final_stats=1 fuzz/corpus/${target}
          done

  # m13 item 7: cross-platform builds. macOS runs the full suite (same
  # IEEE doubles + the forced -ffp-contract=off keep the determinism
  # pins platform-independent); Windows is compile + smoke only — MSVC
  # is not built with the pinned FP flags (they are gcc/clang-only),
  # so cross-platform hash equality is not claimed there.
  macos-build-test:
    name: macOS build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-build:
    name: Windows build (compile + smoke)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build battle_cli
        run: cmake --build build --target battle_cli --config Release

      - name: Smoke run
        shell: bash
        run: ./build/Release/battle_cli --scenario data/scenarios/default.json --seed 42 --ticks 10

      # M14 item 4: Windows byte-identity evidence. The same seeds must
      # produce the Linux/macOS export bytes (the sim math is IEEE-exact
      # ops plus atan2; see docs/milestone-14.md item 4). A failure here
      # is a real cross-platform finding, not a flaky test.
      - name: Export byte-identity pins (default + three-way)
        shell: bash
        run: |
          ./build/Release/battle_cli --scenario data/scenarios/default.json --seed 42 --ticks 300 --export-json pin-default.json
          ./build/Release/battle_cli --scenario data/scenarios/three-way.json --seed 42 --ticks 300 --export-json pin-three-way.json
          echo "908322e6c9fc9a9c5923b0b748f8655f  pin-default.json" | md5sum -c -
          echo "95579bb578efe756ec7c215548fe2092  pin-three-way.json" | md5sum -c -
